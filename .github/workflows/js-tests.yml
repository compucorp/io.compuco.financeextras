name: JS Unit Tests

on: pull_request

jobs:
  js-unit-tests:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run JS unit tests
        run: npm test
